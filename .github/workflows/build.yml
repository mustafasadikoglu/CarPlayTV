name: Build CarPlayTV (iOS & CarPlay IPA)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Test Suites
        run: |
          node scripts/test_parser.js
          node scripts/test_streaming_parser.js
          node scripts/test_vod_models.js
          node scripts/test_carplay_grid.js
          node scripts/test_buffer_manager.js
          node scripts/test_image_cache.js
          node scripts/test_security_phase1.js
          node scripts/test_epg_parser.js
          node scripts/test_xtream_accounts.js
          node scripts/test_series_episodes.js

      - name: Regenerate Xcode Project
        run: node scripts/generate_project.js

      - name: Build App with xcodebuild
        run: |
          set -o pipefail
          xcodebuild -project CarPlayTV.xcodeproj \
            -scheme CarPlayTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD FAILED ==="
              echo "--- Son 150 satır ---"
              tail -n 150 xcodebuild.log
              echo "--- Hata satırları ---"
              grep -iE "error:|failed|unable|could not|dependencies" xcodebuild.log | head -n 50 | while IFS= read -r line; do
                echo "::error title=BuildError::$line"
              done
              exit 1
            }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: xcodebuild.log

      - name: Package Unsigned IPA (TrollStore / Sideload Ready)
        run: |
          mkdir -p build/Payload
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/CarPlayTV.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build -name "CarPlayTV.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "CarPlayTV.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          echo "=== VERIFYING & INJECTING ATS IN INFOPLIST ==="
          plutil -replace NSAppTransportSecurity -xml "<dict><key>NSAllowsArbitraryLoads</key><true/></dict>" "$APP_PATH/Info.plist" || cp CarPlayTV/Info.plist "$APP_PATH/Info.plist"
          echo "=== SIGNING & EMBEDDING CARPLAY ENTITLEMENTS (TROLLSTORE / CARPLAY SUPPORT) ==="
          codesign --force --deep --sign - --entitlements CarPlayTV/CarPlayTV.entitlements "$APP_PATH" || true
          echo "=== VERIFYING EMBEDDED ENTITLEMENTS ==="
          codesign -d --entitlements :- "$APP_PATH" || true
          cp CarPlayTV/CarPlayTV.entitlements "$APP_PATH/arch_entitlements" || true
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r CarPlayTV.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayTV-Release-IPA
          path: build/CarPlayTV.ipa
          retention-days: 14
